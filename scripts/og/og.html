<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Fredoka:wght@700&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#F8F2D7;font-family:'Quicksand',sans-serif;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.b1{left:-160px;top:300px;width:620px;height:620px;background:rgba(255,210,70,.32)}
.b2{left:760px;top:-260px;width:620px;height:620px;background:rgba(239,75,97,.16)}
.b3{left:420px;top:420px;width:760px;height:520px;background:rgba(116,192,71,.16)}
.left{position:absolute;left:52px;top:96px;width:400px}
.logo{width:330px;display:block}
h1{font-family:'Fredoka','Quicksand',sans-serif;font-weight:700;font-size:38px;line-height:1.02;color:#374191;text-transform:uppercase;letter-spacing:-.01em;margin-top:34px}
h1 em{font-style:normal;color:#F57D14}
.line{margin-top:18px;font-weight:700;font-size:19px;color:#374191;letter-spacing:.02em}
.line b{color:#F57D14}
.pill{display:inline-block;margin-top:26px;background:#FFD246;border:3px solid #374191;box-shadow:4px 4px 0 #374191;border-radius:999px;padding:10px 18px;font-weight:700;font-size:18px;letter-spacing:.06em;color:#374191;text-transform:uppercase}
.stage{position:absolute;left:440px;top:0;width:760px;height:630px}
.carton{position:absolute;bottom:-26px;height:560px;filter:drop-shadow(0 22px 26px rgba(54,71,142,.28))}
.mo{left:60px;transform:rotate(-6deg);z-index:2}
.pp{left:280px;transform:rotate(6deg);z-index:3}
.char{position:absolute;bottom:-6px;filter:drop-shadow(0 8px 10px rgba(54,71,142,.25))}
.moc{left:-10px;height:240px;z-index:4;transform:rotate(-4deg)}
.ppc{right:20px;height:300px;z-index:4;transform:rotate(4deg)}
.pip{position:absolute;left:392px;top:74px;width:84px;transform:rotate(12deg)}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="left">
  <img class="logo" src="../../../brand/Final/Logo/wonderade_logo_red.svg" alt="Wonderade">
  <h1>The juice you wish you had when <em>you were growing up.</em></h1>
  <div class="line"><b>8g protein</b> · <b>3g sugar</b> · <b>4g fiber</b> · real fruit</div>
  <div class="pill">Big &amp; Strong Juice</div>
</div>
<img class="pip" src="../../public/characters/pip.png" alt="">
<div class="stage">
  <img class="char ppc" src="../../public/characters/princess-punch.png" alt="">
  <img class="carton mo" src="../../../shopify-theme/assets/major-orange-bottle.png" alt="">
  <img class="carton pp" src="../../../shopify-theme/assets/princess-punch-bottle.png" alt="">
  <img class="char moc" src="../../public/characters/major-orange.png" alt="">
</div>
</body></html>
